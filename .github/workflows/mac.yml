# macOS 빌드: main 에 push 할 때마다 MEON 디스크 이미지(.dmg)를 만든다.
# - 실행 결과 페이지의 Artifacts 에서 받을 수 있고,
# - main 빌드는 'mac-latest' 프리릴리스에도 올라가서 항상 같은 주소로 최신 파일을 받을 수 있다:
#   https://github.com/unzzonzz/meon/releases/download/mac-latest/MEON.dmg
# - 유니버설(Intel + Apple Silicon) 빌드. Apple 개발자 서명·공증은 하지 않고 ad-hoc 서명만 한다.
#   처음 열 때 경고를 넘기는 방법은 doc/INSTALL.md 참고.
name: macOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 버전
        id: ver
        run: |
          V=$(sed -n 's/^project(MEON VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: CMake 구성
        run: cmake -DCMAKE_BUILD_TYPE=Release -B build -DMEON_BUILD_ID=${{ github.run_number }}

      - name: 빌드
        run: cmake --build build --config Release --parallel 4 --target MEON_Standalone MEON_AU MEON_VST3

      - name: ad-hoc 서명
        # Apple Silicon 은 서명 없는 실행 파일을 아예 실행하지 않는다. 개발자 ID 가 없으니 ad-hoc 으로만 서명한다.
        run: |
          A=build/MEON_artefacts/Release
          for b in "$A/Standalone/MEON.app" "$A/AU/MEON.component" "$A/VST3/MEON.vst3"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done
          lipo -info "$A/Standalone/MEON.app/Contents/MacOS/MEON"

      - name: 디스크 이미지 만들기
        run: |
          A=build/MEON_artefacts/Release
          STAGE=dmgstage
          mkdir -p "$STAGE/플러그인"
          cp -R "$A/Standalone/MEON.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cp -R "$A/AU/MEON.component" "$A/VST3/MEON.vst3" "$STAGE/플러그인/"
          cp doc/INSTALL.md "$STAGE/설치 안내.md"
          mkdir -p dist
          hdiutil create -volname "MEON ${{ steps.ver.outputs.version }}" -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov "dist/MEON-${{ steps.ver.outputs.version }}-mac.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MEON-${{ steps.ver.outputs.version }}-mac-${{ github.run_number }}
          path: dist/*.dmg

      - name: mac-latest 프리릴리스 갱신
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/MEON-*-mac.dmg MEON.dmg
          NOTES="main $(git rev-parse --short HEAD) 빌드 (v${{ steps.ver.outputs.version }}, run ${{ github.run_number }})"
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest MEON.dmg --prerelease --target "$GITHUB_SHA" \
            --title "MEON macOS (최신 main 빌드)" --notes "$NOTES"
